<style>
/* Layout: one-column phone app — header band, screen area, fixed bottom bar. Hi-vis amber on diesel-olive ink, like a generator plate. */
:root{
  --bg:#f3f2ec; --surface:#ffffff; --sunk:#e8e7df; --line:#d6d4c8;
  --ink:#1f2419; --ink2:#5b6150; --accent:#e8a317; --accent-ink:#2a2105; --brand:#2f3a24;
  --ok:#2e7d4f; --ok-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#b3261e; --bad-bg:#fbe3e1;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15180f; --surface:#1e2317; --sunk:#262c1e; --line:#363e2b;
  --ink:#eceee3; --ink2:#a9b09a; --accent:#f2b230; --accent-ink:#1f1803; --brand:#c9d6b0;
  --ok:#7fd3a0; --ok-bg:#183424; --warn:#f5c26b; --warn-bg:#3a2c0c; --bad:#ff9c94; --bad-bg:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15180f; --surface:#1e2317; --sunk:#262c1e; --line:#363e2b;
  --ink:#eceee3; --ink2:#a9b09a; --accent:#f2b230; --accent-ink:#1f1803; --brand:#c9d6b0;
  --ok:#7fd3a0; --ok-bg:#183424; --warn:#f5c26b; --warn-bg:#3a2c0c; --bad:#ff9c94; --bad-bg:#3d1a17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px;padding-top:12px;padding-bottom:110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-size:1.6rem;color:var(--brand);line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--ink2);font-weight:500}
.ver{font-family:var(--f-mono);font-size:.72rem;color:var(--ink2);background:var(--sunk);padding:2px 8px;border-radius:99px}
h2{font-family:var(--f-display);font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:700}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.muted{color:var(--ink2);font-size:.88rem}
.mono{font-family:var(--f-mono);font-size:.8rem;direction:ltr;unicode-bidi:embed}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border:0;border-radius:18px;padding:18px 12px;font-family:var(--f-display);font-size:1.35rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:104px;justify-content:center}
.bigbtn span{font-family:var(--f-body);font-size:.8rem;font-weight:500;opacity:.85}
.bigbtn.use{background:var(--accent);color:var(--accent-ink)}
.bigbtn.rec{background:var(--brand);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--bad)}
button,select,input,textarea{font:inherit;color:inherit}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.pri{color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dark{background:var(--brand);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.stat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.full{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nogap .chips>*,.nogap .row>*{margin:0 0 8px 8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.92rem;min-height:40px}
.chip.on{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tile b{font-size:.98rem}
.tile small{color:var(--ink2);font-size:.72rem;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile.on{border-color:var(--accent);background:var(--warn-bg)}
.tile:disabled{opacity:.4}
.gen{border:1px dashed var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.grp-h{background:var(--brand);color:var(--bg);padding:8px 12px;border-radius:10px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gtitle{font-family:var(--f-display);font-size:1.15rem;color:var(--brand)}
.gen-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.selrow{background:var(--bg);border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.selrow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer}
.qty input{width:70px;text-align:center;min-height:40px;padding:4px}
.check{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px;border-radius:12px;font-size:.92rem}
.check.warn{background:var(--warn-bg);color:var(--warn)} .check.bad{background:var(--bad-bg);color:var(--bad)} .check.ok{background:var(--ok-bg);color:var(--ok)}
.check label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)}
pre.msg{unicode-bidi:plaintext;text-align:start;line-height:1.75;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--f-body);font-size:1rem;margin:0;max-height:420px;overflow:auto}
pre.code{unicode-bidi:plaintext;white-space:pre-wrap;direction:ltr;text-align:left;font-family:var(--f-mono);font-size:.78rem;background:var(--sunk);border-radius:10px;padding:10px;margin:0;max-height:180px;overflow:auto;color:var(--ink2)}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:300px;overflow-y:auto}
.sugg button{background:var(--surface);border:0;border-bottom:1px solid var(--line);text-align:right;padding:10px 12px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--sunk)}
.cancelled{opacity:.55;text-decoration:line-through}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.bar button{background:none;border:0;padding:10px 2px 12px;cursor:pointer;font-size:.74rem;white-space:nowrap;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bar button svg{width:24px;height:24px}
nav.bar button.on{color:var(--brand)}
nav.bar button.on svg{stroke:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px;text-align:right}
.helpbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;cursor:pointer;color:var(--brand)}
.sheet-back{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(10,12,6,.45);z-index:30}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--surface);border-radius:18px;border:1px solid var(--line);border-top:3px solid var(--accent);padding:16px;max-width:544px;margin:0 auto;display:grid;gap:12px;max-height:calc(100vh - 160px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sheet h3{font-family:var(--f-display);font-size:1.25rem}
.sheet p{margin:0;line-height:1.75}
.dots{display:flex;gap:5px;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:18px;border-radius:9px}
.spot{position:relative;z-index:32;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(10,12,6,.45)!important;border-radius:14px}
nav.bar.spotnav{z-index:32}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;font-size:.92rem;flex-wrap:wrap}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--sunk);color:var(--ink)}
.alert span{flex:1;min-width:160px}
.badge{position:absolute;top:4px;margin-right:22px;background:var(--bad);color:#fff;border-radius:99px;font-size:.65rem;padding:0 5px;line-height:16px}
nav.bar button{position:relative}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative}.thumb img{width:100%;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer}
.flash{animation:flash 1.2s}@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.diff-pos{color:var(--ok);font-weight:700}.diff-neg{color:var(--bad);font-weight:700}
@media (max-width:360px){.card{padding:12px}.gen{padding:8px}.tile{padding:8px;min-height:56px}.tile b{font-size:.9rem}.bigbtn{font-size:1.2rem;min-height:92px}}
@media (prefers-reduced-motion:no-preference){.bigbtn,.tile,.chip{transition:transform .08s}.bigbtn:active,.tile:active,.chip:active{transform:scale(.97)}}
.row.share4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row.share4 .btn{width:100%;justify-content:center;text-align:center;white-space:nowrap;padding-inline:6px;font-size:.95rem}
html{scroll-padding-bottom:96px;scroll-padding-top:12px}
</style>
