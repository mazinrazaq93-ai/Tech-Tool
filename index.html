<style>
/* Layout: one-column phone app — header band, screen area, fixed bottom bar. Hi-vis amber on diesel-olive ink, like a generator plate. */
:root{
  --bg:#f3f2ec; --surface:#ffffff; --sunk:#e8e7df; --line:#d6d4c8;
  --ink:#1f2419; --ink2:#5b6150; --accent:#e8a317; --accent-ink:#2a2105; --brand:#2f3a24;
  --ok:#2e7d4f; --ok-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fff1d6; --bad:#b3261e; --bad-bg:#fbe3e1;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15180f; --surface:#1e2317; --sunk:#262c1e; --line:#363e2b;
  --ink:#eceee3; --ink2:#a9b09a; --accent:#f2b230; --accent-ink:#1f1803; --brand:#c9d6b0;
  --ok:#7fd3a0; --ok-bg:#183424; --warn:#f5c26b; --warn-bg:#3a2c0c; --bad:#ff9c94; --bad-bg:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15180f; --surface:#1e2317; --sunk:#262c1e; --line:#363e2b;
  --ink:#eceee3; --ink2:#a9b09a; --accent:#f2b230; --accent-ink:#1f1803; --brand:#c9d6b0;
  --ok:#7fd3a0; --ok-bg:#183424; --warn:#f5c26b; --warn-bg:#3a2c0c; --bad:#ff9c94; --bad-bg:#3d1a17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;direction:rtl}
.wrap{max-width:560px;margin:0 auto;padding-left:16px;padding-right:16px;padding-top:12px;padding-bottom:110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-size:1.6rem;color:var(--brand);line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:.8rem;color:var(--ink2);font-weight:500}
.ver{font-family:var(--f-mono);font-size:.72rem;color:var(--ink2);background:var(--sunk);padding:2px 8px;border-radius:99px}
h2{font-family:var(--f-display);font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:700}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.muted{color:var(--ink2);font-size:.88rem}
.mono{font-family:var(--f-mono);font-size:.8rem;direction:ltr;unicode-bidi:embed}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border:0;border-radius:18px;padding:18px 12px;font-family:var(--f-display);font-size:1.35rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:104px;justify-content:center}
.bigbtn span{font-family:var(--f-body);font-size:.8rem;font-weight:500;opacity:.85}
.bigbtn.use{background:var(--accent);color:var(--accent-ink)}
.bigbtn.rec{background:var(--brand);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--bad)}
button,select,input,textarea{font:inherit;color:inherit}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.pri{color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dark{background:var(--brand);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.stat:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.full{width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:80px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nogap .chips>*,.nogap .row>*{margin:0 0 8px 8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.92rem;min-height:40px}
.chip.on{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px}
.tile b{font-size:.98rem}
.tile small{color:var(--ink2);font-size:.72rem;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile.on{border-color:var(--accent);background:var(--warn-bg)}
.tile:disabled{opacity:.4}
.gen{border:1px dashed var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.grp-h{background:var(--brand);color:var(--bg);padding:8px 12px;border-radius:10px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gtitle{font-family:var(--f-display);font-size:1.15rem;color:var(--brand)}
.gen-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--ink2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.selrow{background:var(--bg);border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.selrow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer}
.qty input{width:70px;text-align:center;min-height:40px;padding:4px}
.check{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px;border-radius:12px;font-size:.92rem}
.check.warn{background:var(--warn-bg);color:var(--warn)} .check.bad{background:var(--bad-bg);color:var(--bad)} .check.ok{background:var(--ok-bg);color:var(--ok)}
.check label{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)}
pre.msg{unicode-bidi:plaintext;text-align:start;line-height:1.75;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:var(--f-body);font-size:1rem;margin:0;max-height:420px;overflow:auto}
pre.code{unicode-bidi:plaintext;white-space:pre-wrap;direction:ltr;text-align:left;font-family:var(--f-mono);font-size:.78rem;background:var(--sunk);border-radius:10px;padding:10px;margin:0;max-height:180px;overflow:auto;color:var(--ink2)}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:300px;overflow-y:auto}
.sugg button{background:var(--surface);border:0;border-bottom:1px solid var(--line);text-align:right;padding:10px 12px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--sunk)}
.cancelled{opacity:.55;text-decoration:line-through}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.bar button{background:none;border:0;padding:10px 2px 12px;cursor:pointer;font-size:.74rem;white-space:nowrap;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bar button svg{width:24px;height:24px}
nav.bar button.on{color:var(--brand)}
nav.bar button.on svg{stroke:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px;text-align:right}
.helpbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;cursor:pointer;color:var(--brand)}
.sheet-back{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(10,12,6,.45);z-index:30}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--surface);border-radius:18px;border:1px solid var(--line);border-top:3px solid var(--accent);padding:16px;max-width:544px;margin:0 auto;display:grid;gap:12px;max-height:calc(100vh - 160px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sheet h3{font-family:var(--f-display);font-size:1.25rem}
.sheet p{margin:0;line-height:1.75}
.dots{display:flex;gap:5px;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:18px;border-radius:9px}
.spot{position:relative;z-index:32;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(10,12,6,.45)!important;border-radius:14px}
nav.bar.spotnav{z-index:32}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;font-size:.92rem;flex-wrap:wrap}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--sunk);color:var(--ink)}
.alert span{flex:1;min-width:160px}
.badge{position:absolute;top:4px;margin-right:22px;background:var(--bad);color:#fff;border-radius:99px;font-size:.65rem;padding:0 5px;line-height:16px}
nav.bar button{position:relative}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative}.thumb img{width:100%;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb button{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer}
.flash{animation:flash 1.2s}@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.diff-pos{color:var(--ok);font-weight:700}.diff-neg{color:var(--bad);font-weight:700}
@media (max-width:360px){.card{padding:12px}.gen{padding:8px}.tile{padding:8px;min-height:56px}.tile b{font-size:.9rem}.bigbtn{font-size:1.2rem;min-height:92px}}
@media (prefers-reduced-motion:no-preference){.bigbtn,.tile,.chip{transition:transform .08s}.bigbtn:active,.tile:active,.chip:active{transform:scale(.97)}}
</style>

const SK_AR={"ب":"b","پ":"b","ت":"t","ط":"t","ث":"t","ج":"j","چ":"j","ح":"","خ":"k","د":"d","ذ":"d","ض":"d","ظ":"d","ر":"r","ز":"z","س":"s","ص":"s","ش":"s","ع":"","غ":"k","ف":"f","ق":"k","ك":"k","گ":"k","ل":"l","م":"m","ن":"n","ه":"","ة":"","و":"","ي":"","ى":"","ا":"","أ":"","إ":"","آ":"","ء":"","ئ":"","ؤ":""};
const SK_STOP=/^(موقع|مولدة|site|bbiq|ftth|ftth2|metro|مترو|scis|data|center|centre|داتا|سنتر|office|st|dc|ons|rpt|hybrid|haybrid|solar|max)$/i;
function skelWord(w){w=String(w).toLowerCase();
  if(/[؀-ۿ]/.test(w)){w=w.replace(/^(و?ال)/,"");let o="";for(const ch of w){if(ch in SK_AR)o+=SK_AR[ch];else if(/[0-9]/.test(ch))o+=ch;else{const d="٠١٢٣٤٥٦٧٨٩".indexOf(ch);if(d>=0)o+=d}}return o.replace(/(.)\1+/g,"$1")}
  w=w.replace(/^al[-_]?/,"").replace(/([a-z])[2375]([a-z]|$)/g,"$1$2");
  w=w.replace(/sh/g,"s").replace(/kh/g,"k").replace(/gh/g,"k").replace(/th/g,"t").replace(/dh/g,"d").replace(/ch/g,"j").replace(/ph/g,"f").replace(/[qgc]/g,"k").replace(/p/g,"b").replace(/v/g,"f").replace(/x/g,"ks");
  return w.replace(/[aeiouyhw'\-_.]/g,"").replace(/(.)\1+/g,"$1")}
function skel(s){return String(s||"").replace(/[()\/,_\-]+/g," ").replace(/([؀-ۿ])([0-9٠-٩])/g,"$1 $2").replace(/([a-z])\s*-?\s*([0-9])(?![a-z0-9])/gi,"$1 $2").split(/\s+/).filter(w=>w&&!SK_STOP.test(w)).map(skelWord).filter(Boolean)}
function skelScore(qs,toks){let sc=0;for(const w of qs){let best=0;for(const t of toks){if(t===w)best=Math.max(best,3);else if(!/^\d+$/.test(w)&&w.length>=2&&t.indexOf(w)===0)best=Math.max(best,2-Math.min(1,(t.length-w.length)/4));else if(!/^\d+$/.test(w)&&w.length>=3&&t.indexOf(w)>=0)best=Math.max(best,1)}
    if(!best){if(/^\d+$/.test(w)){if(toks.some(t=>/^\d+$/.test(t)))sc-=1;continue}return 0}sc+=best}return sc}

}

function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

/* compute balance + waiting list */
function compute(){
  const bal={},waiting=[];
  const ms=S.moves.filter(m=>!m.cancel).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
  const alloc=(k,q,m)=>{let left=q;for(const w of waiting){if(w.k!==k||w.left<=0)continue;const t=Math.min(w.left,left);w.left-=t;left-=t;(w.closedBy=w.closedBy||[]).push(m.mr||"");if(left<=0)break}return left};
  for(const m of ms){
    for(const it of m.items){
      if(m.type==="start"||m.type==="adjust"){bal[it.k]=(bal[it.k]||0)+it.q}
      else if(m.type==="use"){ if(it.src==="own"){bal[it.k]=(bal[it.k]||0)-it.q;waiting.push({k:it.k,q:it.q,left:it.q,date:m.date,site:m.site,mid:m.id})} }
      else if(m.type==="receive"){bal[it.k]=(bal[it.k]||0)+it.q; if(m.comp) alloc(it.k,it.q,m)}
      else if(m.type==="from"){alloc(it.k,it.q,m)}
    }
  }
  return {bal,waiting:waiting.filter(w=>w.left>0)};
}

function latin(v){return String(v==null?"":v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٫,]/g,".")}

/* photos: IndexedDB (kept on the phone) */
let DB=null;
function idb(){return new Promise(res=>{if(DB) return res(DB);try{const r=indexedDB.open("techReceivablePhotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=()=>res(null)}catch(e){res(null)}})}
async function putPhoto(id,data){const d=await idb();if(!d)return false;return new Promise(r=>{try{const t=d.transaction("p","readwrite");t.objectStore("p").put(data,id);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}})}
async function getPhoto(id){const d=await idb();if(!d)return null;return new Promise(r=>{try{const q=d.transaction("p").objectStore("p").get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
function shrink(file){return new Promise(res=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.65))};img.onerror=()=>res(null);img.src=rd.result};rd.onerror=()=>res(null);rd.readAsDataURL(file)})}
function pickPhotos(){return new Promise(res=>{const f=$("#filePick");f.value="";f.multiple=true;f.onchange=async()=>{const out=[];for(const file of Array.from(f.files||[]).slice(0,MAXPH)){const d=await shrink(file);if(d)out.push(d)}res(out)};f.click()})}
const MAXPH=5;
function photosHTML(arr,p,label){arr=arr||[];return `<div class="row"><button class="btn" id="${p}Photo" ${arr.length>=MAXPH?"disabled":""}>📷 ${label}</button><span class="muted">${arr.length?arr.length+" صورة":"مستحسن كإثبات"} · حتى ${MAXPH}</span></div>
  ${arr.length?`<div class="thumbs">${arr.map((d,i)=>`<div class="thumb"><img src="${d}" alt="صورة ${i+1}"><button data-rmph="${p}:${i}" aria-label="حذف الصورة">×</button></div>`).join("")}</div>`:""}`}
function bindPhotos(p,obj,rerender){const b=$("#"+p+"Photo");if(b)b.onclick=async()=>{const add=await pickPhotos();if(add.length){obj.photos=(obj.photos||[]).concat(add).slice(0,MAXPH);rerender()}};
  document.querySelectorAll(`[data-rmph^="${p}:"]`).forEach(x=>x.onclick=()=>{obj.photos.splice(+x.dataset.rmph.split(":")[1],1);rerender()})}
async function storePhotos(m,arr){if(!arr||!arr.length)return;m.photos=[];for(let i=0;i<arr.length;i++){const id="p"+m.id+"_"+i;if(await putPhoto(id,arr[i]))m.photos.push(id)}}
function photoIds(m){return (m.photo?[m.photo]:[]).concat(m.photos||[])}

/* team code: data is encrypted in the published file; pure-JS SHA-256 so it works on every phone and when opened as a file */
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const SHA_W=new Uint32Array(64);
function shaBlock(H,b,o){const W=SHA_W;for(let i=0;i<16;i++)W[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
  for(let i=16;i<64;i++){const x=W[i-15],y=W[i-2];W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+W[i-16])|0}
  let a=H[0],b2=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+SHA_K[i]+W[i])|0;const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&b2)^(a&c)^(b2&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+b2)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
const SHA_IV=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
function shaFinish(H,tail,total){const n=tail.length,pad=((n+9+63)>>6)<<6,b=new Uint8Array(pad);b.set(tail);b[n]=0x80;const bits=total*8;
  b[pad-4]=bits>>>24;b[pad-3]=(bits>>>16)&255;b[pad-2]=(bits>>>8)&255;b[pad-1]=bits&255;b[pad-8]=Math.floor(bits/4294967296)&255;
  for(let o=0;o<pad;o+=64)shaBlock(H,b,o);const out=new Uint8Array(32);for(let i=0;i<8;i++){out[4*i]=H[i]>>>24;out[4*i+1]=(H[i]>>>16)&255;out[4*i+2]=(H[i]>>>8)&255;out[4*i+3]=H[i]&255}return out}
function sha256(m){const H=new Int32Array(SHA_IV);const full=m.length&~63;for(let o=0;o<full;o+=64)shaBlock(H,m,o);return shaFinish(H,m.subarray(full),m.length)}
function hmacPre(key){if(key.length>64)key=sha256(key);const ip=new Uint8Array(64),op=new Uint8Array(64);for(let i=0;i<64;i++){const k=key[i]||0;ip[i]=k^0x36;op[i]=k^0x5c}
  const I=new Int32Array(SHA_IV),O=new Int32Array(SHA_IV);shaBlock(I,ip,0);shaBlock(O,op,0);return {I,O}}
function hmacWith(P,m){const H=new Int32Array(P.I);const full=m.length&~63;for(let o=0;o<full;o+=64)shaBlock(H,m,o);const inner=shaFinish(H,m.subarray(full),64+m.length);
  const H2=new Int32Array(P.O);return shaFinish(H2,inner,96)}
function pbkdf2(pw,salt,iters,len){const P=hmacPre(pw);const out=new Uint8Array(len);for(let blk=1,pos=0;pos<len;blk++){const s=new Uint8Array(salt.length+4);s.set(salt);s[salt.length+3]=blk;
    let u=hmacWith(P,s);const t=u.slice();for(let i=1;i<iters;i++){u=hmacWith(P,u);for(let j=0;j<32;j++)t[j]^=u[j]}out.set(t.subarray(0,Math.min(32,len-pos)),pos);pos+=32}return out}
function b64(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function hex(u){return Array.from(u).map(x=>(x<16?"0":"")+x.toString(16)).join("")}
function unhex(h){const u=new Uint8Array(h.length/2);for(let i=0;i<u.length;i++)u[i]=parseInt(h.substr(2*i,2),16);return u}
function teamKey(code,V){return pbkdf2(new TextEncoder().encode(latin(String(code)).trim().toUpperCase()),b64(V.salt),V.iters,64)}
function vaultOpen(V,key){const ek=key.subarray(0,32),mk=key.subarray(32,64),nonce=b64(V.nonce),ct=b64(V.ct);
  const m=new Uint8Array(nonce.length+ct.length);m.set(nonce);m.set(ct,nonce.length);if(hex(hmacWith(hmacPre(mk),m))!==V.tag)return null;
  const pt=new Uint8Array(ct.length),blk=new Uint8Array(32+nonce.length+4);blk.set(ek);blk.set(nonce,32);
  for(let o=0,c=0;o<ct.length;o+=32,c++){const p=32+nonce.length;blk[p]=c>>>24;blk[p+1]=(c>>>16)&255;blk[p+2]=(c>>>8)&255;blk[p+3]=c&255;const ks=sha256(blk);for(let j=0;j<32&&o+j<ct.length;j++)pt[o+j]=ct[o+j]^ks[j]}
  try{return JSON.parse(new TextDecoder().decode(pt))}catch(e){return null}}

/* sharing */
async function shareText(text,via){
  if(via==="tg"){window.open("https://t.me/share/url?url="+encodeURIComponent(" ")+"&text="+encodeURIComponent(text),"_blank");return}
  if(via==="wa"){window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");return}
  copyText(text,"تم النسخ — الصقه في تيليكرام أو واتساب")
}
function shareBlock(text,id,mark){const mk=mark?` data-mark="${mark}"`:"";return `<pre class="msg" id="${id}">${esc(text)}</pre>
 <div class="row"><a class="btn pri" target="_blank" rel="noopener" href="https://t.me/share/url?url=%20&text=${encodeURIComponent(text)}"${mk}>إرسال في تيليكرام</a>
 <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text)}"${mk}>واتساب</a>
 <button class="btn" data-copy="${id}"${mk}>نسخ</button></div>`}
function copyText(t,msgOk){const fallback=()=>{let ok=false;try{const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);ok=document.execCommand("copy");ta.remove()}catch(e){}toast(ok?(msgOk||"تم النسخ"):"لم يتم النسخ — اضغط مطولاً على النص واختر نسخ")};
  try{if(navigator.clipboard&&navigator.clipboard.writeText&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast(msgOk||"تم النسخ"),fallback)}else fallback()}catch(e){fallback()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;copyText(document.getElementById(b.dataset.copy).textContent)});
async function shareOrSave(name,text,type,title){try{const file=new File([text],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:title||name});return "shared"}}catch(e){if(e&&e.name==="AbortError")return "cancel"}
  downloadFile(name,text,type,true);return "saved"}
function downloadFile(name,text,type,noBom){try{const blob=new Blob([noBom?text:"\ufeff"+text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){} toast("إذا لم يبدأ التحميل استخدم زر النسخ")}

function closeGuide(){guideStep=null;document.querySelectorAll(".spot").forEach(e=>e.classList.remove("spot"));$("#nav").classList.remove("spotnav");const g=$("#guide");if(g)g.remove();if(!S.guideSeen){S.guideSeen=true;save()}if(!S.tech.name)go("set")}
function drawGuide(){const st=GUIDE[guideStep];if(st.go&&view!==st.go)go(st.go);
  document.querySelectorAll(".spot").forEach(e=>e.classList.remove("spot"));$("#nav").classList.remove("spotnav");
  let g=$("#guide");if(!g){g=document.createElement("div");g.id="guide";document.body.appendChild(g)}
  const el=st.hl&&document.querySelector(st.hl);
  g.innerHTML=`${el?"":'<div class="sheet-back"></div>'}<div class="sheet" role="dialog" aria-label="دليل الاستخدام"><div class="dots">${GUIDE.map((x,i)=>`<i class="${i===guideStep?"on":""}"></i>`).join("")}</div>
   <h3>${st.t}</h3><p>${st.b}</p>
   <div class="row"><button class="btn pri" id="gNext" style="flex:1">${st.last?"ابدأ":"التالي"}</button>${guideStep>0?'<button class="btn" id="gPrev">السابق</button>':""}${st.last?"":'<button class="btn" id="gSkip">تخطي</button>'}</div></div>`;
  if(el){el.classList.add("spot");if(el.closest("nav"))$("#nav").classList.add("spotnav");else{const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight*0.45)scrollTo(0,Math.max(0,scrollY+r.top-90))}}
  $("#gNext").onclick=()=>{if(st.last)return closeGuide();guideStep++;drawGuide()};
  const pv=$("#gPrev");if(pv)pv.onclick=()=>{guideStep--;drawGuide()};const sk=$("#gSkip");if(sk)sk.onclick=closeGuide}
function openHelp(){const h=HELP[view]||HELP.home;let g=$("#guide");if(!g){g=document.createElement("div");g.id="guide";document.body.appendChild(g)}
  g.innerHTML=`<div class="sheet-back" id="hBack"></div><div class="sheet" role="dialog" aria-label="مساعدة"><h3>مساعدة: ${h[0]}</h3><p>${h[1]}</p>
   <div class="row"><button class="btn pri" id="hOk" style="flex:1">فهمت</button><button class="btn" id="hGuide">الدليل الكامل</button></div></div>`;
  const close=()=>g.remove();$("#hOk").onclick=close;$("#hBack").onclick=close;$("#hGuide").onclick=()=>{g.remove();openGuide(0)}}
document.addEventListener("click",e=>{if(e.target.closest("#helpBtn"))openHelp()});

/* =============== ALERTS (reminders) =============== */
function alertsList(){const {bal,waiting}=compute();const out=[];const t=today();
  const live=S.moves.filter(m=>!m.cancel);
  if(!S.tech.name||!S.tech.id) out.push({lvl:"warn",t:"أكمل اسمك ورقمك الوظيفي.",go:"set",b:"الإعدادات"});
  else if(!live.some(m=>m.type==="start")) out.push({lvl:"warn",t:"أدخل رصيدك الافتتاحي — من ملف ERP أو من الصورة.",go:"start",b:"إدخال"});
  const neg=Object.entries(bal).filter(([,q])=>q<0);if(neg.length) out.push({lvl:"bad",t:`رصيد بالسالب في ${neg.length} مادة — سجّل الاستلام الناقص أو صحح الرصيد.`,go:"bal",b:"رصيدي"});
  const old=waiting.filter(w=>daysBetween(w.date,t)>5);if(old.length) out.push({lvl:"bad",t:`${old.length} مادة تنتظر التعويض منذ أكثر من 5 أيام — اسأل المهندس عن الـ MR.`,go:"wait",b:"عرض"});
  else if(waiting.length) out.push({lvl:"info",t:`${waiting.length} مادة تنتظر التعويض.`,go:"wait",b:"عرض"});
  const last=live.map(m=>m.date).sort().pop();
  if(last&&daysBetween(last,t)>=3) out.push({lvl:"info",t:`آخر قيد قبل ${daysBetween(last,t)} أيام. هل صرفت أو استلمت شيئاً لم تسجله؟`,go:"use",b:"صرفت"});
  if(live.length>=3&&(!S.lastBackup||daysBetween(S.lastBackup,t)>=7)) out.push({lvl:"warn",t:S.lastBackup?`آخر نسخة احتياطية قبل ${daysBetween(S.lastBackup,t)} أيام.`:"لم تأخذ نسخة احتياطية بعد.",go:"set",b:"نسخة احتياطية"});
  const usedWeek=live.some(m=>m.type==="use"&&daysBetween(m.date,t)<7);
  if(usedWeek&&(!S.lastReport||daysBetween(S.lastReport,t)>=7)) out.push({lvl:"info",t:"لم ترسل تقرير الأسبوع للمهندس.",go:"report",arg:"week",b:"التقرير"});
  return out}
function alertsHTML(){const a=alertsList();if(!a.length)return "";
  return `<div class="alerts" id="alerts">${a.map(x=>`<div class="alert ${x.lvl}"><span>${esc(x.t)}</span><button class="btn sm" data-go="${x.go}"${x.arg?` data-arg="${x.arg}"`:""}>${x.b}</button></div>`).join("")}</div>`}
document.addEventListener("click",e=>{const a=e.target.closest("[data-mark]");if(!a)return;S[a.dataset.mark]=today();save()});

    const m={id:S.seq++,type:d.type,date:d.date,items:d.items.filter(i=>i.q),note:d.note};

function flashRow(p,i){setTimeout(()=>{const el=$("#"+p+"q"+i);if(!el)return;const row=el.closest(".selrow");row.classList.add("flash");row.scrollIntoView({block:"center"});el.focus()},30)}
function addOnce(arr,k,q,p,rerender){const i=arr.findIndex(x=>x.k===k);if(i>=0){toast("هذه المادة مضافة مسبقاً — عدّل الكمية");rerender();flashRow(p,i);return}arr.push({k,q});rerender()}
/* item picker (search all catalogue) */
function itemPickerHTML(p){return `<label class="f">ابحث عن مادة (عربي أو إنكليزي أو رقم القطعة)<input type="text" id="${p}Q" placeholder="مثال: فلتر هواء، 2654403، دهن" autocomplete="off"></label><div id="${p}Res"></div>`}
function bindPicker(p,onPick){const q=$("#"+p+"Q"),res=$("#"+p+"Res");
  const show=()=>{const v=norm(q.value);if(!v){res.innerHTML="";return}
    const list=allItems().filter(i=>norm(i.ar+" "+i.k+" "+i.code).includes(v)).slice(0,12);
    res.innerHTML=`<div class="sugg">${list.map(i=>`<button data-k="${esc(i.k)}"><b>${esc(i.ar)}</b><br><span class="muted mono">${esc(i.k)}</span></button>`).join("")}<button data-new="1">+ مادة غير موجودة: «${esc(q.value)}»</button></div>`;
    res.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>onPick(b.dataset.k));
    res.querySelector("[data-new]").onclick=()=>{const k="? "+q.value.trim();if(!(S.items||[]).find(i=>i.k===k)){(S.items=S.items||[]).push({k,ar:q.value.trim(),unit:"Ea",code:"",custom:true});save()}onPick(k)}};
  q.oninput=show}
function selRow(it,i,p,withSrc,bal){const I=item(it.k);
  return `<div class="selrow"><div class="top"><div><b>${esc(I.ar)}</b>${it.k.startsWith("? ")?' <span class="tag warn">للتأكد من المهندس</span>':""}<div class="muted mono">${esc(I.k)}${I.code?" · "+I.code:""}</div></div><button class="btn sm danger" data-rm="${p}:${i}" aria-label="حذف">حذف</button></div>
   <div class="row"><div class="qty"><button data-dq="${p}:${i}:-1" aria-label="أقل">−</button><input type="text" inputmode="decimal" id="${p}q${i}" value="${it.q}"><button data-dq="${p}:${i}:1" aria-label="أكثر">+</button></div><span class="muted">${I.unit==="L"?"لتر":I.unit==="m"?"متر":I.grp==="erp"?"الكمية":"عدد"}</span></div>
   ${withSrc?`<div class="chips"><button class="chip ${it.src==="own"?"on":""}" data-src="${p}:${i}:own">من ذمتي${bal!=null?" (عندي "+fmtQ(it.k,bal[it.k]||0)+")":""}</button><button class="chip ${it.src==="wh"?"on":""}" data-src="${p}:${i}:wh">استلمته من المخزن لهذا العمل</button></div>${!it.src?'<span class="tag bad">اختر من أين</span>':""}`:""}</div>`}
function bindSel(p,arr,rerender){
  document.querySelectorAll(`[data-rm^="${p}:"]`).forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.rm.split(":")[1],1);rerender()});
  document.querySelectorAll(`[data-dq^="${p}:"]`).forEach(b=>b.onclick=()=>{const[,i,d]=b.dataset.dq.split(":");arr[i].q=Math.max(0,(+arr[i].q||0)+(+d));rerender()});
  arr.forEach((it,i)=>{const el=$("#"+p+"q"+i);if(el)el.onchange=e=>{it.q=parseFloat(latin(e.target.value))||0;rerender()}});
  document.querySelectorAll(`[data-src^="${p}:"]`).forEach(b=>b.onclick=()=>{const[,i,s]=b.dataset.src.split(":");arr[i].src=s;rerender()});
}

function siteSearchHTML(p,val){return `<label class="f">اسم الموقع أو رمزه<input type="text" id="${p}Site" value="${esc(val)}" placeholder="اكتب اسم الموقع بالعربي أو الإنكليزي أو رمزه" autocomplete="off"></label>${S.tech.gov?"":'<span class="muted">اختر محافظتك في الإعدادات لتظهر مواقعك أولاً.</span>'}<div id="${p}SiteRes"></div>`}
function bindSiteSearch(p,onPick){const q=$("#"+p+"Site"),res=$("#"+p+"SiteRes");
  const show=()=>{const v=norm(q.value);let list,head="";
    if(!v){const ids=[];S.moves.filter(m=>m.type==="use"&&!m.cancel).sort((a,b)=>b.id-a.id).forEach(m=>{if(!ids.includes(m.site))ids.push(m.site)});(S.sites||[]).filter(c=>!c.over).forEach(c=>{if(!ids.includes(c.id))ids.push(c.id)});
      list=ids.map(siteById).filter(Boolean).slice(0,6);if(!list.length){res.innerHTML="";return}head='<div class="muted" style="padding:6px 12px;background:var(--sunk)">مواقعي الأخيرة</div>'}
    else{const qs=skel(q.value);const mine=S.tech.gov;
      list=allSites().map(s=>{const al=(S.alias&&S.alias[s.id])||[];const text=norm([s.ar,s.name,(s.alt||[]).join(" "),(s.arAlt||[]).join(" "),al.join(" "),s.fms,s.erp,s.code].join(" "));
        let sc=text.indexOf(v)>=0?10:skelScore(qs,siteToks(s));if(sc&&mine&&s.gov===mine)sc+=1.5;return {s,sc}}).filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,10).map(o=>o.s);
      if(!list.length)head='<div class="muted" style="padding:8px 12px">لم نجد الموقع. جرّب كتابة جزء من الاسم أو رمزه.</div>'}
    res.innerHTML=`<div class="sugg">${head}${list.map(s=>`<button data-sid="${esc(s.id)}"><b>${esc(siteLabel(s))}</b><br><span class="muted">${esc(GOV_AR[s.gov]||s.gov||"")}${siteCodes(s)?" · <span class=mono>"+esc(siteCodes(s))+"</span>":""} · ${s.gens.map(genName).join(" + ")||"المولدات غير مسجلة"}</span></button>`).join("")}<button data-addsite="1">+ الموقع غير موجود — أضفه</button></div>`;
    res.querySelectorAll("[data-sid]").forEach(b=>b.onclick=()=>{const qv=q.value.trim();if(qv&&/[\u0600-\u06ff]/.test(qv)){const id=b.dataset.sid,st=siteById(id);const known=norm([st.ar,(st.arAlt||[]).join(" ")].join(" "));
        if(st&&known.indexOf(norm(qv))<0){S.alias=S.alias||{};const arr=S.alias[st.id]||[];if(arr.indexOf(qv)<0){arr.unshift(qv);S.alias[st.id]=arr.slice(0,3);save()}}}onPick(b.dataset.sid)});
    res.querySelector("[data-addsite]").onclick=()=>go("addsite",{back:p,name:q.value})};
  q.oninput=show;show()}

  <div class="card"><h3>الموقع</h3>${s?siteCard(s):siteSearchHTML("u",U.q)}</div>
  <button class="btn pri full" id="uNext" ${s&&s.gens.length?"":"disabled"}>التالي: اختر المواد</button>
  ${s&&!s.gens.length?'<p class="check warn">هذا الموقع بلا مولدات مسجلة. اضغط «تصحيح المولدات» وأضفها أولاً.</p>':""}`;
  $("#uDate").onchange=e=>U.date=e.target.value;
  if(!s) bindSiteSearch("u",id=>{U.site=id;useStep1()});
  else{$("#chgSite").onclick=()=>{U.site=null;U.items=[];useStep1()};$("#fixGen").onclick=()=>go("addsite",{back:"u",edit:s.id})}

function siteCard(s){return `<div class="selrow"><div class="top"><div><b>${esc(siteLabel(s))}</b><div class="muted">${esc(GOV_AR[s.gov]||s.gov||"")}${siteCodes(s)?" · <span class=mono>"+esc(siteCodes(s))+"</span>":""} · ${esc((TYPES.find(t=>t[0]===s.type)||["","نوع غير معروف"])[1])}</div></div><button class="btn sm" id="chgSite">تغيير</button></div>
 ${s.gens.map((g,i)=>`<div class="row"><span class="tag">G${i+1}</span><b>${esc(genName(g))}</b>${genRow(g)?"":'<span class="tag warn">غير موجود في جدول المولدات</span>'}</div>`).join("")}
 ${s.src==="tech"||s.edited?'<span class="tag warn">أضافه/عدّله الفني — يحتاج تأكيد المهندس</span>':""}
 <div class="row"><span class="muted">المولدات خطأ؟</span><button class="btn sm" id="fixGen">تصحيح المولدات</button></div></div>`}

function useStep2(){setTimeout(saveDraft,0);const s=siteById(U.site);const {bal}=compute();
  const genBlocks=s.gens.map((g,gi)=>{const P=genParts(g);
    const btn=(role)=>{const p=P&&P[role];const sel=U.items.findIndex(x=>x.gen===gi&&x.role===role);
      if(!p) return `<button class="tile" disabled><b>${ROLE_AR[role]}</b><small>غير معروف لهذا المولد</small></button>`;
      return `<button class="tile ${sel>=0?"on":""}" data-role="${gi}:${role}"><b>${ROLE_AR[role]}${role==="oil"?" "+p.q+" لتر":role==="cool"?" (علبة 4 لتر)":""}</b><small>${esc(p.k)}</small></button>`};
    return `<div class="gen"><div class="gen-h"><span class="gtitle">المولدة ${gi+1} (G${gi+1})</span><b>${esc(genName(g))}</b></div><span class="muted">اضغط فقط على ما بدّلته في هذه المولدة</span>

/* mistake checks */
function useChecks(){const s=siteById(U.site);const {bal}=compute();const out=[];
  U.items.forEach((it,i)=>{ if(!it.src) out.push({id:"src"+i,lvl:"bad",block:true,t:`اختر «من ذمتي» أو «من المخزن» لـ ${item(it.k).ar}`});
    if(!(it.q>0)) out.push({id:"q"+i,lvl:"bad",block:true,t:`كمية ${item(it.k).ar} صفر`});
    if(it.role==="oil"&&it.std&&it.q!==it.std) out.push({id:"oilq"+i,lvl:"warn",t:`الدهن ${it.q} لتر، والمعتاد لهذا المولد (G${it.gen+1}) ${it.std} لتر. هل أنت متأكد؟`});
    if(it.role==="cool"&&it.cap&&it.q*4>it.cap+3) out.push({id:"cool"+i,lvl:"warn",t:`الماء الأخضر ${it.q} علبة (${it.q*4} لتر) أكثر من سعة المولد (${it.cap} لتر).`});
    if(it.k.startsWith("? ")) out.push({id:"new"+i,lvl:"warn",t:`«${item(it.k).ar}» مادة غير موجودة في القائمة. المهندس سيكتب اسمها الصحيح.`});
  });
  // own-stock sufficiency (sum per item)
  const need={};U.items.filter(i=>i.src==="own").forEach(i=>need[i.k]=(need[i.k]||0)+i.q);
  Object.entries(need).forEach(([k,q])=>{if((bal[k]||0)<q) out.push({id:"bal"+k,lvl:"warn",t:`${item(k).ar}: تقول من ذمتي ${fmtQ(k,q)} لكن رصيدك المسجل ${fmtQ(k,bal[k]||0)}. هل نسيت تسجيل استلام؟`})});
  // oil without filters on kit sites
  s.gens.forEach((g,gi)=>{const has=r=>U.items.some(x=>x.gen===gi&&x.role===r);
    if(has("oil")){const miss=["oilF","fuelF"].filter(r=>(genParts(g)||{})[r]&&!has(r));
      if(miss.length){const kit=KIT_TYPES.includes(s.type);
        out.push({id:"kit"+gi,lvl:kit?"bad":"warn",reason:true,gi,t:`G${gi+1}: بدّلت الدهن بدون ${miss.map(r=>ROLE_AR[r]).join(" و ")}${kit?" — في هذا الموقع تتبدل معاً":""}. ما السبب؟`})}}});
  if(!S.tech.name||!S.tech.id) out.push({id:"tech",lvl:"bad",block:true,go:"set",t:"اكتب اسمك ورقمك الوظيفي في الإعدادات أولاً — يظهران في الرسالة. ما اخترته محفوظ."});
  if(U.date>today()) out.push({id:"fut",lvl:"bad",block:true,t:"التاريخ في المستقبل."});
  else if(daysBetween(U.date,today())>2) out.push({id:"old",lvl:"warn",t:`تاريخ العمل قبل ${daysBetween(U.date,today())} أيام. تأكد أنك لم تسجله سابقاً.`});
  // duplicates
  const keys=new Set(U.items.map(i=>i.k));
  S.moves.filter(m=>m.type==="use"&&!m.cancel&&m.site===U.site&&Math.abs(daysBetween(m.date,U.date))<=3&&m.items.some(i=>keys.has(i.k)))
    .forEach(m=>out.push({id:"dup"+m.id,lvl:"warn",t:`سجّلت نفس المواد لنفس الموقع بتاريخ ${m.date}. هل هذا تكرار؟`}));
  return out}

const RLM="‏",LRI="⁦",PDI="⁩";
function iso(t){t=String(t==null?"":t);return /[؀-ۿ]/.test(t)?t:LRI+t+PDI}
const LAT_RUN=/\d{4}-\d{2}-\d{2}|(?:[A-Za-z]|[0-9]+[A-Za-z])[A-Za-z0-9\-.\/]*(?: +[A-Za-z0-9][A-Za-z0-9\-.\/]*)*/g;
function isoRuns(t){return String(t).replace(/[⁦⁩]/g,"").replace(LAT_RUN,m=>LRI+m+PDI)}
function rtl(lines){return lines.map(l=>l===""?"":RLM+isoRuns(l)).join("\n")}
function itemShort(k){const I=item(k);return k.indexOf("? ")===0?I.ar+" (غير موجود في القائمة)":iso(I.ar)}
function qtyText(k,q){const u=item(k).unit;q=Math.round(q*100)/100;return u==="L"?q+" لتر":u==="m"?q+" متر":String(q)}
function srcText(it){return it.src==="own"?" (من ذمتي)":it.src==="wh"?" (من المخزن)":""}
function missingFilters(s,gi){const g=s.gens[gi];const has=r=>U.items.some(x=>x.gen===gi&&x.role===r);if(!has("oil"))return [];return ["oilF","fuelF"].filter(r=>(genParts(g)||{})[r]&&!has(r)).map(r=>ROLE_AR[r])}
function fmsCode(){const s=siteById(U.site);const L=["[TRT1]","SITE="+(s.fms||"-")+" | "+(s.erp||s.code||"-")+" | "+s.name,"DATE="+U.date,"TECH="+(S.tech.id||"-")+" | "+(S.tech.name||"-")];
  s.gens.forEach((g,gi)=>L.push("G"+(gi+1)+"="+(g.brand||"?")+" "+g.kva+"KVA"));
  U.items.forEach(it=>L.push("ITEM="+(it.gen!=null?"G"+(it.gen+1):"-")+" | "+(item(it.k).code||"-")+" | "+it.q+" | "+(it.src==="own"?"FROM-TECH":"WAREHOUSE")+" | "+it.k));
  Object.keys(U.reasons).forEach(id=>L.push("NOFILTER=G"+(+id.replace("kit","")+1)+" | "+U.reasons[id]));
  if(U.note.trim())L.push("NOTE="+U.note.trim().replace(/\n/g," "));L.push("[/TRT1]");return L.join("\n")}
function fmsText(){return useMessage()+"\n\n"+fmsCode()}
function useMessage(){const s=siteById(U.site);const L=[];
  L.push("صرف مواد");
  L.push("الموقع: "+(s.ar?s.ar+" — "+iso(s.name):iso(s.name)));
  if(s.fms)L.push("رمز FMS: "+iso(s.fms));if(s.erp&&s.erp!==s.fms)L.push("رمز ERP: "+iso(s.erp));if(!s.fms&&!s.erp&&s.code)L.push("الرمز: "+iso(s.code));
  L.push("المحافظة: "+(GOV_AR[s.gov]||s.gov||"-"));L.push("التاريخ: "+iso(U.date));
  L.push("الفني: "+(S.tech.name||"-")+(S.tech.id?" — "+iso(S.tech.id):""));
  s.gens.forEach((g,gi)=>{const its=U.items.filter(x=>x.gen===gi);const r=U.reasons["kit"+gi];if(!its.length&&!r)return;
    L.push("");L.push("▪️ المولدة "+(gi+1)+": "+iso(genName(g)));
    its.forEach(it=>L.push("• "+itemShort(it.k)+": "+qtyText(it.k,it.q)+srcText(it)));
    if(r){const miss=missingFilters(s,gi);L.push("⚠️ لم يُبدّل "+(miss.length?miss.join(" و "):"الفلاتر")+": "+r)}});
  const oth=U.items.filter(x=>x.gen==null);if(oth.length){L.push("");L.push("▪️ مواد أخرى");oth.forEach(it=>L.push("• "+itemShort(it.k)+": "+qtyText(it.k,it.q)+srcText(it)))}
  const own={};U.items.filter(x=>x.src==="own").forEach(it=>own[it.k]=(own[it.k]||0)+it.q);const ok=Object.keys(own);
  if(ok.length){L.push("");L.push("📌 يحتاج تعويض:");ok.forEach(k=>L.push("• "+itemShort(k)+": "+qtyText(k,own[k])))}
  if(U.note.trim()){L.push("");L.push("📝 ملاحظة: "+U.note.trim())}
  return rtl(L)}

/* ERP document paste (MR or Stock Entry copied from ERP) */
function parseErpDoc(text){let t=String(text||"").replace(/[\r\n]+/g,"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<=a)return null;let o;try{o=JSON.parse(t.slice(a,b+1))}catch(e){return null}
  if(!o||!o.name||!Array.isArray(o.items))return null;
  const isSte=/stock entry/i.test(o.doctype||"")||/^MAT-STE/i.test(o.name);
  const mr=isSte?((o.items.find(i=>i.material_request)||{}).material_request||o.material_request||""):o.name;
  return {kind:isSte?"ste":"mr",name:o.name,mr:String(mr||"").toUpperCase(),custody:o.technician_custody_action||"",emp:String(o.employee||(o.items[0]&&(o.items[0].custody_technician||o.items[0].employee))||""),
    wf:o.workflow_state||"",status:o.status||"",docstatus:o.docstatus,date:String(o.transaction_date||o.posting_date||"").slice(0,10),
    site:(o.items[0]&&(o.items[0].site_name||o.items[0].site))||o.site_name||"",siteCode:(o.items[0]&&o.items[0].site)||o.site||"",
    items:o.items.map(i=>({code:String(i.item_code||"").toUpperCase(),name:cellStr(i.item_name||i.description||""),q:+i.qty||0}))}}

  $("#bkFileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("#bkIn").value=rd.result;$("#bkRestore").click()};rd.readAsText(f)};
  $("#bkRestore").onclick=async()=>{let o;try{o=JSON.parse($("#bkIn").value);if(!o.data||!o.data.moves)throw 0}catch(e){return toast("النسخة غير صحيحة — اختر الملف أو الصق النص كاملاً")}
      const b=$("#bkRestore");if(!b.dataset.sure){b.dataset.sure=1;b.textContent="اضغط مرة أخرى — سيستبدل بياناتك الحالية";$("#bkInfo").textContent=o.data.moves.length+" قيد · "+((o.data.tech&&o.data.tech.name)||"")+(o.photos?" · "+Object.keys(o.photos).length+" صورة":"");return}
      if(o.photos)for(const id of Object.keys(o.photos))await putPhoto(id,o.photos[id]);
      S=o.data;S.guideSeen=true;save();toast("تم الاسترجاع");render()};
  const ib=$("#installBtn");if(ib)ib.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;ib.hidden=true};
  try{if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(es=>{const el=$("#stoInfo");if(el)el.textContent=`المستخدم ${(es.usage/1048576).toFixed(1)} ميغابايت من ${Math.round(es.quota/1048576)} ميغابايت متاحة — ${S.moves.length} قيد`});else $("#stoInfo").textContent=S.moves.length+" قيد"}catch(e){}}
const bk=()=>JSON.stringify({app:"techReceivable",version:VERSION,saved:new Date().toISOString(),data:S});
async function bkFull(withPhotos){const o={app:"techReceivable",version:VERSION,saved:new Date().toISOString(),data:S};
  if(withPhotos){o.photos={};for(const m of S.moves)for(const id of photoIds(m)){const p=await getPhoto(id);if(p)o.photos[id]=p}}return JSON.stringify(o)}
function isStandalone(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
let deferredInstall=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;const b=$("#installBtn");if(b)b.hidden=false});

document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button]")){e.preventDefault();e.target.click()}});
function startApp(){(function(){const d=loadDraft();if(d){U=d.U||null;R=d.R||null;draftStart=d.draftStart||null;if(U)U.saving=false;if(R)R.saving=false;if(draftStart)draftStart.saving=false}
 const h=location.hash.slice(1);if(["bal","wait","log","set"].includes(h))view=h;})();
$("#nav").hidden=false;render();
try{if("serviceWorker" in navigator&&document.querySelector('link[rel="manifest"]')&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js")}catch(e){}
if(!S.guideSeen)setTimeout(()=>openGuide(0),300);}
const KEYSTORE="techReceivable.key";
function lockScreen(V,msg){$("#nav").hidden=true;$("#hdrTech").textContent="سجل المواد المستلمة والمصروفة";
  $("#app").innerHTML=`<div class="card"><h2>رمز الفريق</h2><p style="margin:0">اكتب رمز الفريق الذي أرسله لك قائد الفريق أو المهندس. تكتبه مرة واحدة فقط على هذا الهاتف.</p>
   <label class="f">الرمز<input type="text" id="tcode" inputmode="numeric" autocomplete="off" dir="ltr" style="font-size:1.4rem;letter-spacing:.2em;text-align:center"></label>
   ${msg?`<div class="check bad">${esc(msg)}</div>`:""}<button class="btn pri full" id="tgo">فتح</button></div>`;
  const go=()=>{const c=$("#tcode").value;if(!latin(c).trim())return;const b=$("#tgo");b.disabled=true;b.textContent="جارٍ الفتح…";
    setTimeout(()=>{let key,d=null;try{key=teamKey(c,V);d=vaultOpen(V,key)}catch(e){}
      if(!d)return lockScreen(V,"الرمز غير صحيح. تأكد منه واكتبه مرة أخرى.");try{localStorage.setItem(KEYSTORE,hex(key))}catch(e){}initData(d);startApp()},30)};
  $("#tgo").onclick=go;$("#tcode").onkeydown=e=>{if(e.key==="Enter")go()};setTimeout(()=>{try{$("#tcode").focus()}catch(e){}},50)}
(function boot(){const plain=document.getElementById("tdata");if(plain){initData(JSON.parse(plain.textContent));return startApp()}
  const vEl=document.getElementById("vault");if(!vEl){$("#app").textContent="ملف غير مكتمل";return}const V=JSON.parse(vEl.textContent);
  let k=null;try{k=localStorage.getItem(KEYSTORE)}catch(e){}
  if(k){let d=null;try{d=vaultOpen(V,unhex(k))}catch(e){}if(d){initData(d);return startApp()}}
  lockScreen(V)})();
(function(){try{const d=document.createElement("div");d.style.display="flex";d.style.flexDirection="column";d.style.rowGap="1px";d.appendChild(document.createElement("div"));d.appendChild(document.createElement("div"));document.body.appendChild(d);const g=d.scrollHeight===1;d.remove();if(!g)document.documentElement.classList.add("nogap")}catch(e){}})();
</script>
